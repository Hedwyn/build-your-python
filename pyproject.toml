[project]
name = "metapython"
version = "0.1.0"
description = "A Python library to build your own CPython executable"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py/metapython"]

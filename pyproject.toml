[project]
name = "build-your-python"
version = "0.1.0"
description = "A Python library to build your own CPython executable"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Baptiste Pestourie" }]
requires-python = ">=3.12"
dependencies = ["ziglang>=0.17.0.post0,<0.18", "click>=8"]

[project.scripts]
byp = "byp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py/byp"]
exclude = ["cpython/.git"]

[tool.hatch.build.targets.wheel.force-include]
"build.zig" = "byp/_vendor/build.zig"
"build.zig.zon" = "byp/_vendor/build.zig.zon"
"build" = "byp/_vendor/build"
"cpython" = "byp/_vendor/cpython"
"vendoring" = "byp/_vendor/vendoring"

[project]
name = "metapython"
version = "0.1.0"
description = "A Python library to build your own CPython executable"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
cli = ["click"]

[project.scripts]
metapython = "metapython.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py/metapython"]
exclude = ["cpython/.git"]

[tool.hatch.build.targets.wheel.force-include]
"build.zig" = "metapython/_vendor/build.zig"
"build.zig.zon" = "metapython/_vendor/build.zig.zon"
"build" = "metapython/_vendor/build"
"cpython" = "metapython/_vendor/cpython"
